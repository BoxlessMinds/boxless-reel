version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # passlib 1.7.4 is not compatible with bcrypt >= 4.1. On bcrypt 5.0.0 every
      # hash and verify call raises "ValueError: password cannot be longer than
      # 72 bytes", so registration and login fail with a 500 error.
      # Keep bcrypt pinned in pyproject.toml until passlib is replaced.
      - dependency-name: "bcrypt"

  - package-ecosystem: npm
    directory: /youtube-transcript-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /
      - /youtube-transcript-ui
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
